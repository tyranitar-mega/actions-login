name: "ScopeDB OIDC Login"
description: "Bridge the job's GitHub OIDC token to ScopeDB data commands by exporting SCOPEDB_OIDC_TOKEN and SCOPEDB_WORKSPACE_ID."
author: "ScopeDB, Inc."

branding:
  icon: "log-in"
  color: "blue"

inputs:
  workspace-id:
    description: "ScopeDB workspace ID that data commands authenticate against."
    required: true
  audience:
    description: "OIDC token audience: the deployment's control-plane origin."
    required: false
    default: "https://control.scopedb.cloud"

runs:
  using: "composite"
  steps:
    - name: Request the GitHub OIDC token
      shell: bash
      env:
        SCOPEDB_OIDC_AUDIENCE: ${{ inputs['audience'] }}
        SCOPEDB_OIDC_WORKSPACE_ID: ${{ inputs['workspace-id'] }}
      run: |
        set -euo pipefail
        if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
          echo "::error title=actions-login::GitHub did not expose an OIDC token endpoint; grant the job 'permissions: id-token: write'."
          exit 1
        fi
        response="$(curl -fsSL --get "${ACTIONS_ID_TOKEN_REQUEST_URL}" \
          --data-urlencode "audience=${SCOPEDB_OIDC_AUDIENCE}" \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          -H "Accept: application/json")"
        token="$(printf '%s' "${response}" | sed -nE 's/.*"value"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p')"
        if [[ -z "${token}" ]]; then
          echo "::error title=actions-login::GitHub did not return an OIDC token."
          exit 1
        fi
        echo "::add-mask::${token}"
        {
          echo "SCOPEDB_OIDC_TOKEN=${token}"
          echo "SCOPEDB_WORKSPACE_ID=${SCOPEDB_OIDC_WORKSPACE_ID}"
        } >> "${GITHUB_ENV}"
